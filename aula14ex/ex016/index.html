<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vamos contar</h1>
    </header>
    <main>
        <section>
            <div class="input">
                <label for="">Início:</label>
                <input type="number" name="inicio" id="inicio" placeholder="Coloque um Número inicial">
            </div>
            <div class="input">
                <label for="">Fim:</label>
                <input type="number" name="fim" id="fim" placeholder="Coloque um Número final">
            </div>
            <div class="input">
                <label for="">Passo:</label>
                <input type="number" name="passo" id="passo" placeholder="Coloque um passo">
            </div>
            <div class="button">
                <input type="button" value="Contar" onclick="Contar()">
            </div>
            <div id="res">
                
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; CursoemVideo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
