        <h1>Analisador de Números</h1>

    <main>
        <section>
            <div>

                <input type="number" name="num" id="inum">
                <input type="button" value="Adicionar" onclick="adicionar()">                
            </div>
            <div>
                <select name="" id="lista" size="5">

                </select>
                <br><input type="button" value="Finalizar" onclick="finalizar()">
            </div>
            <div id="res">
                
            </div>
        </section>
    </main>

    </footer>
