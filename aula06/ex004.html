<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 004 - javascript</title>
    <style>
        body {
            font: normal 20pt Verdana;
        }
    </style>
</head>
<body>
    
    <script>
        var nome = window.prompt('Qual é seu nome?')
        document.write(`Olá, ${nome}! Seu nome tem ${nome.length} letras.<br>`) //document.write para escrever na tela
        document.write(`Olá, ${nome}! Seu nome em letras minúsculas é ${nome.toLowerCase()} <br>`) //letras minúsculas
        document.write(`Olá, ${nome}! Seu nome em letras MAIÚSCULAS é ${nome.toUpperCase()}`) //letras maiúsculas
    </script>
</body>
</html>
