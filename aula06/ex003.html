<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 003 - javascript</title>
    <style>
        body {
            background-color: rgba(105, 105, 173);
            color: white;
            font: normal 20pt Arial;
        }

        h1 {
            color: rgb(255, 212, 22);
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Já me livrei da maldição!!</p>

    <script>
        var n1 = Number.parseFloat(window.prompt("Digite um número: ")) //conversão de string --> número real
        var n2 = Number.parseInt(window.prompt("Digite outro número: ")) //conversão de string --> número inteiro
        var n3 = Number(window.prompt("Digite outro número: ")) //conversão de string --> o javascript decide o tipo do número (inteiro ou real)
        var s = n1 + n2 + n3
        window.alert(`A soma entre ${n1} , ${n2} e ${n3} é igual a ${s}`)

        //(number + number) para adição
        //(string + string) para concatenação
    </script>
</body>
</html>
