<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refazendo o ex010</title>
</head>
<body>
    <h1>Radar de Velocidade</h1>
    <input type="number" name="velocidade" id="velocidade">
    <input type="button" value="Enviar" onclick="Verificar()">
    <div id="res">

    </div>

    <script>
        function Verificar() {
            var vel = document.getElementById('velocidade')
            var res = document.getElementById('res')
            var vel = Number(velocidade.value)

            res.innerHTML = (`<p>Sua velocidade no radar foi de <strong>${vel}Km/h</strong></p>`)
            if (vel > 40) {
                res.innerHTML += (`<p>Você foi <strong>MULTADO</strong> no valor de <strong>R$ 300,00</strong></p>`)
            }
            res.innerHTML += (`<p>Use cinto de segurança!</p>`)
        }
    </script>
</body>
</html>
