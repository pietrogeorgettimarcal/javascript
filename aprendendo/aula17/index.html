<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>
    <main>
        <section>
            <div>
                <label for="">Número: </label>
                <input type="number" name="num" id="inum" placeholder="Digite um número entre 1 e 100">
                <br><input type="button" value="Adicionar" class="button" onclick="adicionar()">
            </div>
            <div>
                <select name="lista" id="ilista" size="6">

                </select>
                <br><input type="button" value="Finalizar" class="button" onclick="finalizar()">
            </div>
            <div id="res">

            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 - Analisador de Números</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
